services:
  - type: cron
    name: listam-monitor
    runtime: python
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor_listam.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LISTAM_URL
        value: https://www.list.am/category/62/1?n=8&cmtype=0
      - key: LISTAM_FETCHER
        value: curl_cffi
      - key: LISTAM_STORAGE
        value: github
      - key: LISTAM_NOTIFIER
        value: telegram
      - key: GITHUB_PATH
        value: listam_listings.json
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
